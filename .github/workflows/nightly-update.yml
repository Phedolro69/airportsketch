name: Nightly Data Sync & Deploy

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  # Allow manual execution anytime from the GitHub Actions tab
  workflow_dispatch:
  # Deploy automatically when code updates are pushed to main
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static data and website
        run: python scripts/build_data.py --output dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
