name: Nightly Data Sync & Deploy

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  # Allow manual execution anytime from the GitHub Actions tab
  workflow_dispatch:
  # Deploy automatically when code updates are pushed to main
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/**'

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fichiers FAA bruts mis en cache par cycle AIRAC : un seul téléchargement tous les 28 jours,
      # et repli sur le cycle précédent (restore-keys) si la FAA est injoignable
      - name: Compute current AIRAC cycle
        id: airac
        run: echo "cycle=$(cd scripts && python -c 'import datetime, faa_approaches as f; print(f.airac_cycle(datetime.datetime.now(datetime.timezone.utc).date())[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore FAA cache
        id: faa-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/faa
          key: faa-${{ steps.airac.outputs.cycle }}
          restore-keys: faa-

      - name: Build static data and website
        run: python scripts/build_data.py --output dist --faa-cache .cache/faa

      # Zones de conflit (bulletins EASA) : si l'EASA est injoignable ou change sa mise en page, le site est
      # quand même déployé, simplement sans cette couche
      - name: Build conflict zones layer
        continue-on-error: true
        run: python scripts/build_conflict_zones.py --output dist

      # Espaces aériens OpenAIP (CC BY-NC 4.0, usage non commercial). Secret OPENAIP_API_KEY à créer dans
      # Settings > Secrets and variables > Actions ; sans lui, la couche reste simplement désactivée.
      # Les données ne changent qu'avec le cycle AIRAC (28 jours) : un seul téléchargement par cycle, mis en
      # cache (.cache/airspaces) ; si OpenAIP est injoignable, on republie le cycle précédent (restore-keys).
      # Pour forcer un nouveau téléchargement : supprimer le cache « airspaces-… » (Actions > Caches).
      - name: Restore airspaces cache
        id: asp-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/airspaces
          key: airspaces-${{ steps.airac.outputs.cycle }}
          restore-keys: airspaces-

      - name: Build airspaces layer
        id: asp-build
        if: steps.asp-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          python scripts/build_airspaces.py --output .cache/airspaces-new
          if [ -f .cache/airspaces-new/data/airspaces/index.json ]; then
            rm -rf .cache/airspaces
            mkdir -p .cache/airspaces
            mv .cache/airspaces-new/data/airspaces .cache/airspaces/airspaces
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save airspaces cache
        if: steps.asp-build.outputs.built == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/airspaces
          key: airspaces-${{ steps.airac.outputs.cycle }}

      - name: Add airspaces layer to site
        run: |
          if [ -f .cache/airspaces/airspaces/index.json ]; then
            mkdir -p dist/data
            cp -r .cache/airspaces/airspaces dist/data/airspaces
            echo "Espaces aériens ajoutés au site"
          else
            echo "Pas de données d'espaces aériens : couche désactivée"
          fi

      # Clé = cycle réellement obtenu (peut être l'ancien si la FAA était en panne)
      - name: Read FAA cycle used
        id: faa-used
        run: echo "cycle=$(cat .cache/faa/CYCLE 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Save FAA cache
        if: steps.faa-used.outputs.cycle != '' && steps.faa-cache.outputs.cache-matched-key != format('faa-{0}', steps.faa-used.outputs.cycle)
        uses: actions/cache/save@v4
        with:
          path: .cache/faa
          key: faa-${{ steps.faa-used.outputs.cycle }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
